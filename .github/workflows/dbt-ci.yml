# Phase 1 §6.2 + §6.3 — the hermetic half of CI.
#
# This workflow runs entirely inside GitHub's cloud and needs ZERO connectivity
# into the homelab, which is the point: under CGNAT there is none. It therefore
# only ever selects the `dev` (DuckDB) target. The `prod` (ClickHouse) target in
# profiles.yml is unreachable from here by design and must never be selected.
#
# It builds no images and publishes no packages. §6.4 does that, in its own
# workflow, because pushing to ghcr is the first step that reaches outward.

name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first — but ONLY for pull requests. A PR run has
# no side effects outside the runner, so cancelling it is free. A run on `main`
# publishes container images, and cancelling that mid-push can leave a tag
# pointing at an incomplete upload. Never make this unconditionally true.
concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. This job reads the repo and writes nothing back — not to this
# repo, and not to homelab-infra. Flux is the only thing that writes manifests.
permissions:
  contents: read

jobs:
  dbt:
    name: parse, compile and test on DuckDB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt

    env:
      # profiles.yml lives in the project, not in ~/.dbt, so it can be version
      # controlled and baked into the runner image in §6.4.
      DBT_PROFILES_DIR: .
      # DBT_DUCKDB_PATH is deliberately NOT set here. The obvious value,
      # ${{ runner.temp }}/ci.duckdb, is invalid: the `runner` context does not
      # exist in job-level env and GitHub rejects the whole workflow file for it,
      # before any step runs. The default `dev.duckdb` lands in dbt/, which is
      # gitignored and is not the directory the artifact step reads.

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact patch, not a floating major. astral-sh publishes no
        # major alias past v7 — `v10` and `v9` are both 404 while `v10.0.1` is a
        # real tag — so `@v10` fails at Set up job with "unable to find version".
        # Check `git/ref/tags/<v>` before assuming a major alias exists; the
        # releases API reports the version, not whether the alias was published.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: dbt/requirements.txt

      - name: Install dbt-core and the adapters
        # Installed into a venv, from the pinned requirements.txt, never
        # re-resolved — a CI run a month from now installs exactly what was
        # verified today.
        #
        # NOT `uv pip install --system`. The runner's system interpreter is
        # externally managed (PEP 668) and uv refuses it outright:
        #   error: The interpreter at /usr is externally managed
        # A venv is also what the README tells a human to do and what the
        # dbt-runner image will do in §6.4, so all three paths now agree.
        run: |
          uv venv --python 3.12 .venv
          uv pip install -r requirements.txt

      - name: Put the venv on PATH
        # So every later step calls `dbt` directly, exactly as a human would.
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Record the versions under test
        run: dbt --version

      # ---- §6.2 -------------------------------------------------------------

      - name: dbt deps
        run: dbt deps

      - name: dbt parse
        # --warn-error promotes every warning to an error. It is what catches
        # config paths that match no resource, and other drift that is harmless
        # today and load-bearing later.
        run: dbt --warn-error parse

      - name: dbt compile
        run: dbt --warn-error compile

      # ---- §6.3 -------------------------------------------------------------

      - name: dbt run
        # The models must exist in DuckDB before they can be tested. DuckDB is
        # in-process and file-backed, so this needs no service container.
        run: dbt --warn-error run

      - name: dbt test
        run: dbt --warn-error test

      # ---- artifact ---------------------------------------------------------

      - name: Upload target/manifest.json
        # §6.5 will publish this same file as a Release asset. Uploading it here
        # first means the manifest and the run that produced it are always
        # traceable to one commit, even for pull requests that publish nothing.
        uses: actions/upload-artifact@v7
        with:
          name: dbt-manifest-${{ github.sha }}
          path: dbt/target/manifest.json
          if-no-files-found: error
          retention-days: 7

  # ---- §6.4 ---------------------------------------------------------------

  images:
    name: build and push ${{ matrix.image }} to ghcr
    # No image is ever published from a commit whose tests did not pass. This is
    # why §6.4 lives in the same workflow as §6.2/§6.3 rather than its own: a
    # separate workflow could only express this with workflow_run, which fires
    # after the fact and would publish first.
    needs: dbt
    # Pull requests must not publish. They run the job above and stop there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Granted on THIS JOB ONLY. The dbt job above stays contents:read — it has
      # no reason to be able to write packages, and a workflow-level grant would
      # hand it that ability for free.
      packages: write

    strategy:
      # Build both images even if one fails, so a single broken Dockerfile does
      # not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - image: dbt-runner
            dockerfile: dbt-runner/Dockerfile
          - image: airflow
            dockerfile: airflow/Dockerfile

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in token, scoped by the packages:write grant above. No PAT
          # is involved in the push side.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # Three tags, each with a different job.
          #
          #   sha-<40 hex>  traceability. Maps an image back to the exact commit.
          #                 Every digest recorded in the infra repo so far was
          #                 resolved through this tag. It is never removed.
          #   latest        convenience for a human pulling the image by hand.
          #                 Nothing in the cluster deploys from it.
          #   build-<UTC>   ordering. A Flux ImagePolicy has to sort the tag list
          #                 to elect one as newest, and neither of the two tags
          #                 above can be sorted: a hex SHA has no order, and
          #                 "latest" is a single fixed string. This stamp is
          #                 monotonic per build, so `numerical: { order: asc }`
          #                 over the extracted digits always elects the most
          #                 recent image. Format is YYYYMMDDHHmmss in UTC --
          #                 fixed width, so numeric and lexical order agree.
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=raw,value=build-{{date 'YYYYMMDDHHmmss' tz='UTC'}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Homelab ELT ${{ matrix.image }} image

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          # The build context is the repository root for both images: the
          # dbt-runner Dockerfile copies dbt/, and the airflow one copies
          # airflow/. Neither can be built from its own subdirectory.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the Actions cache, not in the registry, so a
          # cache miss never publishes anything.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Record the digest
        # §7 and Phase 2 step 10 pin DIGESTS, not tags, with
        # imagePullPolicy: IfNotPresent. Print it where a human can copy it.
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo ''
            echo '```'
            echo 'ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- §6.5 ---------------------------------------------------------------

  manifest:
    name: publish manifest.json as a Release asset
    # Same gate as the image job: the manifest describes a dbt project whose
    # tests passed. `needs: dbt` also gives access to that job's uploaded
    # artifact, which is the point — see the download step below.
    needs: dbt
    # Pull requests must not publish. The dbt job still uploads the run
    # artifact for them; only the Release is restricted to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      # Granted on THIS JOB ONLY, and `contents: write` is what creating a
      # Release and uploading an asset requires. The dbt job stays read-only.
      contents: write

    env:
      # The rolling tag §7's CronJob will fetch from. It never changes, so the
      # cluster hard-codes one URL and never has to resolve "latest":
      #   https://github.com/<owner>/<repo>/releases/download/manifest-latest/manifest.json
      RELEASE_TAG: manifest-latest
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Required. This job runs NO actions/checkout — it needs no source, only
      # the artifact. Without a .git directory `gh` cannot infer which repo it
      # is talking to and every subcommand dies before it reaches the API with:
      #   failed to run git: fatal: not a git repository
      # GH_REPO answers that without dragging a full checkout into the job.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download the manifest the dbt job produced
        # Deliberately NOT a second `dbt compile`. Recompiling here would
        # produce a manifest that no test ever ran against; downloading the
        # artifact guarantees the published file is byte-identical to the one
        # `dbt test` passed on, in this same run.
        #
        # Pinned to v7 to match upload-artifact@v7 above. v8 is current, but
        # the pair must agree on the artifact backend, and v7 is what was
        # verified (`git/ref/tags/v7` resolves; the alias is published).
        uses: actions/download-artifact@v7
        with:
          name: dbt-manifest-${{ github.sha }}
          path: manifest

      - name: Create the rolling release if it does not exist yet
        # `gh` is preinstalled on ubuntu-latest, so no third-party action is in
        # this path at all. First run creates the tag and the release; every
        # later run finds it and skips.
        #
        # TRAP: the git tag stays at the commit that first created it. It does
        # NOT follow main. Do not read the tag as "the commit this manifest came
        # from" — the release body below carries that, and is rewritten each run.
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --title "dbt manifest (rolling)" \
              --notes "Bootstrapping. The body is rewritten on every push to main." \
              --target "${{ github.sha }}"
          fi

      - name: Upload manifest.json, replacing the previous one
        # --clobber is required: without it, uploading an asset whose name
        # already exists on the release fails. The asset name is the fixed
        # filename on purpose, so the download URL never changes.
        run: gh release upload "$RELEASE_TAG" manifest/manifest.json --clobber

      - name: Record which commit this manifest came from
        # The only place the provenance is written, since the tag cannot move.
        run: |
          gh release edit "$RELEASE_TAG" --notes "$(
            printf '%s\n' \
              'Rolling release. `manifest.json` is replaced on every push to `main`.' \
              '' \
              "Source commit: \`${{ github.sha }}\`" \
              "Produced by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '' \
              'The git tag does not move. Read the source commit above, not the tag.'
          )"

      - name: Show the fetch URL §7 will use
        run: |
          {
            echo '### manifest.json'
            echo ''
            echo '```'
            echo '${{ github.server_url }}/${{ github.repository }}/releases/download/'"$RELEASE_TAG"'/manifest.json'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
