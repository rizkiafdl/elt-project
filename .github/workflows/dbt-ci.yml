# Phase 1 §6.2 + §6.3 — the hermetic half of CI.
#
# This workflow runs entirely inside GitHub's cloud and needs ZERO connectivity
# into the homelab, which is the point: under CGNAT there is none.
#
# ⚠️ IT NO LONGER EXECUTES ANY MODEL, AND THAT IS A DELIBERATE REDUCTION MADE ON
# 2026-09-10. The DuckDB `dev` target was removed at Rizki's direction, and with it
# went the only warehouse CI could reach. `dbt run` and `dbt test` are gone from
# this file. So is `dbt compile` -- compile OPENS A CONNECTION and fails here with
# `Database Error ... Connection refused`, which is not obvious until you try it.
#
# WHAT SURVIVES, AND WHY IT IS ENOUGH TO KEEP THE ESTATE WORKING: `dbt parse` does
# NOT connect to anything. Measured against a blackhole address, it returns in
# about a second and writes a complete manifest.json -- 7 nodes, the same count the
# old DuckDB compile produced. That manifest is the artifact the whole cluster
# depends on: §6.5 publishes it, an hourly CronJob syncs it onto a PVC, and Cosmos
# renders the Airflow DAG from it. None of that changes.
#
# 🚩 WHAT IS LOST, SO NOBODY IS SURPRISED BY IT. A model that parses but produces
# wrong SQL is no longer caught at merge time. There is no green build to trust any
# more -- only a green parse. The first thing that executes a model is a task pod
# in the cluster.
#
# The `dbt` job below builds no images and publishes no packages. The three jobs
# after it do: §6.4 pushes two images to ghcr, §6.5 publishes the manifest as a
# Release asset, and §10.2 commits one line back to this repository. Everything
# outward-facing is downstream of a green `dbt` job, and that ordering is the
# reason they all live in one workflow file rather than in several.

name: dbt CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first — but ONLY for pull requests. A PR run has
# no side effects outside the runner, so cancelling it is free. A run on `main`
# publishes container images, and cancelling that mid-push can leave a tag
# pointing at an incomplete upload. Never make this unconditionally true.
concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege. This job reads the repo and writes nothing back — not to this
# repo, and not to homelab-infra. Flux is the only thing that writes manifests.
permissions:
  contents: read

jobs:
  dbt:
    name: parse the project and produce the manifest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt

    env:
      # profiles.yml lives in the project, not in ~/.dbt, so it can be version
      # controlled and baked into the runner image.
      DBT_PROFILES_DIR: .

      # ── §10.4 — THE MANIFEST HALF OF THE SKEW GUARD ─────────────────────────
      # dbt copies every variable prefixed `DBT_ENV_CUSTOM_ENV_` into
      # manifest.json -> metadata.env. `dbt parse` below is the step that writes
      # that file, so these two only have to be visible to it.
      #
      # 🚩 dbt STRIPS THE PREFIX. `DBT_ENV_CUSTOM_ENV_GIT_SHA` here becomes the key
      # `GIT_SHA` in metadata.env -- NOT the full name. Measured on run 23, which
      # shipped the DAG reading the full name and therefore saw an unstamped
      # manifest:
      #
      #   "env": { "GIT_SHA": "557d4061...", "CI_RUN": "23" }
      #
      # ⚠️ RENAMING EITHER VARIABLE HERE BREAKS THE DAG, NOT THIS JOB. elt_dag.py
      # reads the stripped names from MANIFEST_SHA_KEY / MANIFEST_RUN_KEY. Nothing
      # checks the correspondence automatically. Change both sides together.
      #
      # 🚩 THESE ARE READ BY airflow/dags/elt_dag.py AT DAG PARSE TIME. The DAG
      # compares them against the two constants CI rewrites into it (markers
      # `ci:build-source-sha` and `ci:build-ci-run`) and REFUSES TO RENDER when
      # the manifest is newer than the image. Removing either variable here does
      # not fail this job -- it fails the DAG, an hour later, on the cluster.
      #
      # WHY run_number AND NOT A TIMESTAMP. The two artifacts must be ORDERED
      # against each other, and they are built minutes apart inside one run, so
      # their own build times cannot order them. `github.run_number` is one
      # monotonic integer per workflow, and BOTH artifacts of a run get the same
      # value -- which is exactly the property the comparison needs. A hex SHA
      # cannot be ordered at all; it is carried alongside only to name the commit
      # in the error message.
      DBT_ENV_CUSTOM_ENV_GIT_SHA: ${{ github.sha }}
      DBT_ENV_CUSTOM_ENV_CI_RUN: ${{ github.run_number }}

      # ⚠️ THESE ARE PLACEHOLDERS AND NOTHING EVER CONNECTS TO THEM.
      #
      # profiles.yml resolves `env_var('CLICKHOUSE_HOST')` WITH NO DEFAULT, on
      # purpose: this repository is public and a plausible-looking default would be
      # a disclosure. But that means dbt cannot even LOAD the profile unless the
      # variables are set -- and the failure is at profile-render time, before any
      # command runs, which reads like a broken profiles.yml rather than a missing
      # variable.
      #
      # `dbt parse` opens no connection, so any syntactically valid value works.
      # These use the RFC 2606 reserved `.invalid` TLD and a documentation address
      # from RFC 5737, both of which are guaranteed never to resolve to a real
      # host. If a command is ever added here that DOES connect, it will fail
      # against these rather than silently reach something.
      CLICKHOUSE_HOST: ci.invalid
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_USER: ci-parse-only
      CLICKHOUSE_ELT_WRITER_PASSWORD: ci-parse-only
      CLICKHOUSE_DATABASE: elt

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        # Pinned to an exact patch, not a floating major. astral-sh publishes no
        # major alias past v7 — `v10` and `v9` are both 404 while `v10.0.1` is a
        # real tag — so `@v10` fails at Set up job with "unable to find version".
        # Check `git/ref/tags/<v>` before assuming a major alias exists; the
        # releases API reports the version, not whether the alias was published.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: dbt/requirements.txt

      - name: Install dbt-core and the ClickHouse adapter
        # Installed into a venv, from the pinned requirements.txt, never
        # re-resolved — a CI run a month from now installs exactly what was
        # verified today.
        #
        # NOT `uv pip install --system`. The runner's system interpreter is
        # externally managed (PEP 668) and uv refuses it outright:
        #   error: The interpreter at /usr is externally managed
        run: |
          uv venv --python 3.12 .venv
          uv pip install -r requirements.txt

      - name: Put the venv on PATH
        # So every later step calls `dbt` directly, exactly as a human would.
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Record the versions under test
        run: dbt --version

      # ---- §6.2 -------------------------------------------------------------

      - name: dbt deps
        run: dbt deps

      - name: dbt parse
        # THE ONLY dbt COMMAND LEFT THAT TOUCHES THE PROJECT, and the only one that
        # can run here at all. It resolves every ref, source, macro and test, and
        # writes target/manifest.json.
        #
        # --warn-error promotes every warning to an error. It is what catches
        # config paths that match no resource, and other drift that is harmless
        # today and load-bearing later. Keep it: with run and test gone, this flag
        # is now carrying most of what is left of the safety net.
        run: dbt --warn-error parse

      - name: Fail if the manifest is empty or missing
        # 🚩 A MANIFEST WITH ZERO NODES IS THE FAILURE THIS ESTATE CANNOT SEE.
        # `dbt parse` succeeds on a project whose models all failed to be
        # discovered, and §6.5 would then publish an empty manifest to the rolling
        # Release, the CronJob would sync it, and Cosmos would render a DAG with no
        # tasks -- which looks exactly like "nothing has changed yet" rather than
        # like a broken build. Nothing downstream checks this, so it is checked
        # here.
        #
        # This check is NEW and exists because run/test were removed. It replaces
        # nothing; it covers a gap those commands used to cover by accident.
        run: |
          set -euo pipefail
          test -f target/manifest.json
          python3 - <<'PY'
          import json, sys
          m = json.load(open("target/manifest.json"))
          nodes = len(m.get("nodes", {}))
          models = sum(1 for v in m["nodes"].values() if v["resource_type"] == "model")
          print(f"manifest: {nodes} nodes, {models} models")
          if models < 1:
              sys.exit("::error::manifest contains no models -- refusing to publish it")
          PY

      # ---- artifact ---------------------------------------------------------

      - name: Upload target/manifest.json
        # §6.5 publishes this same file as a Release asset. Uploading it here first
        # means the manifest and the run that produced it are always traceable to
        # one commit, even for pull requests that publish nothing.
        uses: actions/upload-artifact@v7
        with:
          name: dbt-manifest-${{ github.sha }}
          path: dbt/target/manifest.json
          if-no-files-found: error
          retention-days: 7

  # ---- §6.4 + §10.2 -------------------------------------------------------
  #
  # THESE TWO JOBS WERE ONE MATRIX JOB UNTIL 2026-09-10, AND SPLITTING THEM IS THE
  # WHOLE OF §10.2.
  #
  # §10.2 decided that the dbt-runner digest lives in the DAG —
  # `airflow/dags/elt_dag.py`, in this repository. That creates a real ordering
  # dependency where there was none: the airflow image contains a file that has to
  # name the dbt-runner image, so dbt-runner must be published FIRST and its digest
  # substituted into the tree BEFORE the airflow image is built.
  #
  # A matrix cannot express that. The two images used to build in parallel because
  # they were genuinely independent; they are not independent any more.
  #
  # What this buys: one CI run produces both images, and the airflow image it
  # produces is pinned to the dbt-runner image from the SAME COMMIT. The
  # manifest/image skew hazard this phase carries (see the phase-2 index, "The
  # hazard this phase has to solve") cannot occur between these two images, because
  # there is no window in which they come from different builds.
  #
  # 🚩 WHAT THIS DOES NOT FIX. The MANIFEST still reaches the cluster on its own
  # hourly schedule, through the rolling Release, and can still be newer or older
  # than the dbt-runner image the DAG names. §10.2 removes one of the two skews.
  # §10.4 is what makes the remaining one loud.

  dbt-runner-image:
    name: build and push dbt-runner to ghcr
    # No image is ever published from a commit that did not parse. ⚠️ That used to
    # read "whose tests did not pass", and it does not any more -- the tests were
    # removed with the DuckDB target on 2026-09-10. The gate is weaker than it was;
    # it is still the strongest one available without a reachable warehouse.
    needs: dbt
    # Pull requests must not publish. They run the dbt job and stop there.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Granted on THIS JOB ONLY. The dbt job above stays contents:read — it has
      # no reason to be able to write packages, and a workflow-level grant would
      # hand it that ability for free.
      packages: write

    outputs:
      # The reason this job exists as a separate job at all. `digest` is an
      # immutable content address; the airflow job substitutes it into the DAG.
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in token, scoped by the packages:write grant above. No PAT
          # is involved in the push side.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dbt-runner
          # Three tags, each with a different job.
          #
          #   sha-<40 hex>  traceability. Maps an image back to the exact commit.
          #                 It is never removed.
          #   latest        convenience for a human pulling the image by hand.
          #                 Nothing in the cluster deploys from it.
          #   build-<UTC>   ordering. A Flux ImagePolicy has to sort the tag list
          #                 to elect one as newest, and neither of the two tags
          #                 above can be sorted: a hex SHA has no order, and
          #                 "latest" is a single fixed string. This stamp is
          #                 monotonic per build, so `numerical: { order: asc }`
          #                 over the extracted digits always elects the most
          #                 recent image. Format is YYYYMMDDHHmmss in UTC --
          #                 fixed width, so numeric and lexical order agree.
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=raw,value=build-{{date 'YYYYMMDDHHmmss' tz='UTC'}}
          labels: |
            org.opencontainers.image.title=dbt-runner
            org.opencontainers.image.description=Homelab ELT dbt-runner image

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          # The build context is the repository root: the dbt-runner Dockerfile
          # copies dbt/, so it cannot be built from its own subdirectory.
          context: .
          file: dbt-runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the Actions cache, not in the registry, so a
          # cache miss never publishes anything.
          cache-from: type=gha,scope=dbt-runner
          cache-to: type=gha,mode=max,scope=dbt-runner
          provenance: false

      - name: Record the digest
        run: |
          {
            echo '### dbt-runner'
            echo ''
            echo '```'
            echo 'ghcr.io/${{ github.repository_owner }}/dbt-runner@${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  airflow-image:
    name: pin the dbt-runner digest, then build and push airflow to ghcr
    # ⚠️ THIS `needs` IS LOAD-BEARING, NOT COSMETIC. It is what guarantees the
    # digest exists before the file that names it is rewritten. If dbt-runner
    # fails to build, no airflow image is published either — which is correct:
    # an airflow image pinned to an image that does not exist is worse than no
    # new airflow image at all.
    needs: dbt-runner-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      # `write`, unlike every other job in this workflow, and it is the one
      # privilege escalation §10.2 introduces. It is needed for the commit-back
      # step at the end, and for nothing else. Scoped to this job.
      contents: write
      packages: write

    env:
      DBT_RUNNER_REF: ghcr.io/${{ github.repository_owner }}/dbt-runner@${{ needs.dbt-runner-image.outputs.digest }}
      DAG_FILE: airflow/dags/elt_dag.py

      # ── §10.4 — THE IMAGE HALF OF THE SKEW GUARD ────────────────────────────
      # The same two values the `dbt` job stamps into manifest.json. One run
      # writes both halves, which is the whole basis of the comparison. See the
      # long comment on the `dbt` job's env block.
      BUILD_SOURCE_SHA: ${{ github.sha }}
      BUILD_CI_RUN: ${{ github.run_number }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Required by the commit-back step. Without it the checkout leaves no
          # credential in .git/config and `git push` fails at authentication,
          # AFTER the image has already been published — a confusing half-done
          # state. Set explicitly rather than relying on the action's default.
          persist-credentials: true

      - name: Pin the dbt-runner digest and the build stamps into the DAG
        # THREE substitutions, each anchored on its own trailing marker comment
        # rather than on the variable name, so renaming a constant does not
        # silently break the rewrite -- it breaks it loudly, right here.
        #
        #   ci:dbt-runner-digest  §10.2  which image a task pod runs
        #   ci:build-source-sha   §10.4  which commit this DAG + that image are from
        #   ci:build-ci-run       §10.4  which CI run built them, for ORDERING
        #
        # The last two are the image half of the skew guard. Their manifest half is
        # set on the `dbt` job's env block, from the same two GitHub context values,
        # in the same run -- which is what makes the DAG's comparison meaningful.
        #
        # ⚠️ ci:build-ci-run IS A BARE INTEGER, NOT A QUOTED STRING. The DAG compares
        # it with `<`, so quoting it would compare two strings and order "10" before
        # "9". The substitution table below writes each value with the right literal
        # form; do not collapse the three entries into one regex.
        run: |
          set -euo pipefail
          test -n "${{ needs.dbt-runner-image.outputs.digest }}"
          python3 - <<'PY'
          import os, re, sys

          path = os.environ["DAG_FILE"]
          src   = open(path).read()

          # (marker, constant name, the literal to write)
          subs = [
              ("ci:dbt-runner-digest", "DBT_RUNNER_IMAGE", '"%s"' % os.environ["DBT_RUNNER_REF"]),
              ("ci:build-source-sha",  "BUILD_SOURCE_SHA", '"%s"' % os.environ["BUILD_SOURCE_SHA"]),
              ("ci:build-ci-run",      "BUILD_CI_RUN",     os.environ["BUILD_CI_RUN"]),
          ]

          # A CI run number must be an integer, because the DAG orders on it.
          if not os.environ["BUILD_CI_RUN"].isdigit():
              sys.exit(f"BUILD_CI_RUN is not an integer: {os.environ['BUILD_CI_RUN']!r}")

          done = []

          for marker, name, literal in subs:
              pattern = re.compile(rf'^{name} = .*  # {re.escape(marker)}$', re.M)
              found = pattern.findall(src)
              if len(found) != 1:
                  sys.exit(
                      f"expected exactly one {marker} marker line in {path}; "
                      f"found {len(found)}. The rewrite anchor is gone -- restore it "
                      "rather than removing this check."
                  )
              src = pattern.sub(f'{name} = {literal}  # {marker}', src)
              done.append(f"pinned {name} = {literal}")

          # Written once, after every substitution has been proven to match. A
          # missing anchor above leaves the file UNTOUCHED rather than half-pinned,
          # and nothing is reported as pinned until it actually is.
          open(path, "w").write(src)
          print("\n".join(done))
          PY

      - name: Verify the pins took
        # 🚩 THE STEP THAT STOPS A PLACEHOLDER FROM BEING PUBLISHED. The rewrite
        # above is a regex substitution, and a regex that matches nothing is not an
        # error to the shell. Without this check a broken anchor would ship an
        # airflow image whose DAG names an all-zero digest, and the failure would
        # surface days later as ImagePullBackOff on a task pod.
        #
        # §10.4 added two more values with the same exposure, and a WORSE failure
        # shape: an un-rewritten `BUILD_CI_RUN = 0` compares as older than every real
        # manifest, so the skew guard would raise on EVERY parse and the DAG would
        # never render at all. Check all three, and check the file still parses --
        # the substitution writes Python, and a bad literal is only visible to a
        # compiler, not to grep.
        run: |
          set -euo pipefail
          grep -qF "$DBT_RUNNER_REF" "$DAG_FILE" \
            || { echo "::error::the dbt-runner digest was not substituted into $DAG_FILE"; exit 1; }
          if grep -q 'sha256:0\{64\}' "$DAG_FILE"; then
            echo "::error::$DAG_FILE still contains the all-zero placeholder digest"
            exit 1
          fi
          python3 -m py_compile "$DAG_FILE" \
            || { echo "::error::$DAG_FILE does not compile after the substitution"; exit 1; }
          python3 - <<'PY'
          import ast, os, sys

          path = os.environ["DAG_FILE"]
          want = {
              "BUILD_SOURCE_SHA": os.environ["BUILD_SOURCE_SHA"],
              "BUILD_CI_RUN":     int(os.environ["BUILD_CI_RUN"]),
          }
          got = {}
          for node in ast.parse(open(path).read()).body:
              if isinstance(node, ast.Assign) and getattr(node.targets[0], "id", "") in want:
                  got[node.targets[0].id] = ast.literal_eval(node.value)

          bad = False
          for name, expected in want.items():
              actual = got.get(name, "<missing>")
              if actual != expected:
                  print(f"::error::{name} is {actual!r} after the rewrite, expected {expected!r}")
                  bad = True
              else:
                  print(f"verified {name} = {actual!r}")
          # Belt and braces: the placeholders must be gone, whatever the expected
          # values happen to be.
          if got.get("BUILD_SOURCE_SHA") == "0" * 40 or got.get("BUILD_CI_RUN") == 0:
              print("::error::the §10.4 build stamps are still at their placeholder values")
              bad = True
          sys.exit(1 if bad else 0)
          PY
          echo "pinned: $DBT_RUNNER_REF"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/airflow
          # Same three tags, same three reasons, as dbt-runner above. The
          # `build-<UTC>` tag is the one the Flux ImagePolicy sorts on (§12.2).
          tags: |
            type=sha,format=long
            type=raw,value=latest
            type=raw,value=build-{{date 'YYYYMMDDHHmmss' tz='UTC'}}
          labels: |
            org.opencontainers.image.title=airflow
            org.opencontainers.image.description=Homelab ELT airflow image

      - name: Build and push
        id: build
        # ⚠️ BUILT FROM THE REWRITTEN WORKING TREE, NOT FROM THE COMMIT. This is
        # the point of the whole job order. `airflow/Dockerfile` copies
        # `airflow/dags/`, so the image picks up the substitution made two steps
        # above without the change having been committed yet.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: airflow/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
          provenance: false

      - name: Commit the pinned digest back to main
        # BOOKKEEPING, NOT A BUILD INPUT. The image is already published and
        # already correct by the time this runs. This step exists so that `main`
        # tells the truth about what is deployed, and so a reader of the DAG sees
        # a real digest instead of the placeholder.
        #
        # 🚩 THIS CANNOT BECOME A BUILD LOOP, for two independent reasons:
        #   1. GitHub does not start a workflow run for a push authenticated with
        #      the built-in GITHUB_TOKEN. This is the primary guard.
        #   2. The skip-ci token in the message. Belt and braces, and the guard
        #      that still holds if someone later swaps in a PAT -- which WOULD
        #      trigger runs, and would loop forever without it.
        #
        # 🚩 DO NOT WRITE THAT TOKEN IN A COMMIT MESSAGE THAT SHOULD BUILD. GitHub
        # matches it anywhere in the head commit message, including in prose that
        # is only DESCRIBING the mechanism. This was learned the expensive way on
        # 2026-09-10: the commit that introduced this very step explained the guard
        # in its own body, and GitHub silently started no run at all -- no error, no
        # skipped run in the list, nothing to click. If a push produces no run,
        # check the commit message before checking the workflow syntax.
        #
        # ⚠️ FAILING THIS STEP DOES NOT MEAN THE RUN IS BAD. If the push loses a
        # race with a human push three times, the job goes red while both images
        # are published and consistent. Re-running the rewrite is safe and
        # idempotent; the correct recovery is to push again, not to delete images.
        run: |
          set -euo pipefail
          if git diff --quiet -- "$DAG_FILE"; then
            echo "digest unchanged -- nothing to commit"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DAG_FILE"
          git commit -m "Pin dbt-runner digest in elt_dag.py (§10.2) [skip ci]" \
                     -m "$DBT_RUNNER_REF" \
                     -m "Written by .github/workflows/dbt-ci.yml from the digest of the dbt-runner image built in run ${{ github.run_id }}, from commit ${{ github.sha }}. Not written by a person. To change which image the DAG uses, push a commit -- do not edit this line by hand."
          # Retry against a moving main. The rebase replays one small,
          # single-line commit, so a conflict here is not expected and is worth
          # investigating rather than forcing.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt -- rebasing onto the current main"
            git pull --rebase origin "${{ github.ref_name }}"
          done
          echo "::error::could not push the digest commit after 3 attempts. Both images ARE published and consistent; only git lags."
          exit 1

      - name: Record the digest
        run: |
          {
            echo '### airflow'
            echo ''
            echo '```'
            echo 'ghcr.io/${{ github.repository_owner }}/airflow@${{ steps.build.outputs.digest }}'
            echo '```'
            echo ''
            echo 'DAG pinned to:'
            echo ''
            echo '```'
            echo "$DBT_RUNNER_REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- §6.5 ---------------------------------------------------------------

  manifest:
    name: publish manifest.json as a Release asset
    # Same gate as the image jobs: the manifest describes a dbt project that
    # parsed cleanly and was checked for emptiness. ⚠️ It no longer means "a project
    # whose tests passed" -- see the dbt job. `needs: dbt` also gives access to that
    # job's uploaded artifact, which is the point — see the download step below.
    needs: dbt
    # Pull requests must not publish. The dbt job still uploads the run
    # artifact for them; only the Release is restricted to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      # Granted on THIS JOB ONLY, and `contents: write` is what creating a
      # Release and uploading an asset requires. The dbt job stays read-only.
      contents: write

    env:
      # The rolling tag §7's CronJob will fetch from. It never changes, so the
      # cluster hard-codes one URL and never has to resolve "latest":
      #   https://github.com/<owner>/<repo>/releases/download/manifest-latest/manifest.json
      RELEASE_TAG: manifest-latest
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Required. This job runs NO actions/checkout — it needs no source, only
      # the artifact. Without a .git directory `gh` cannot infer which repo it
      # is talking to and every subcommand dies before it reaches the API with:
      #   failed to run git: fatal: not a git repository
      # GH_REPO answers that without dragging a full checkout into the job.
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download the manifest the dbt job produced
        # Deliberately NOT a second `dbt parse`. Re-parsing here would produce a
        # manifest that the emptiness check never saw; downloading the artifact
        # guarantees the published file is byte-identical to the one that was
        # checked, in this same run. ⚠️ This step used to say `dbt compile` and
        # `dbt test` -- both are gone (2026-09-10); the reasoning is unchanged.
        #
        # Pinned to v7 to match upload-artifact@v7 above. v8 is current, but
        # the pair must agree on the artifact backend, and v7 is what was
        # verified (`git/ref/tags/v7` resolves; the alias is published).
        uses: actions/download-artifact@v7
        with:
          name: dbt-manifest-${{ github.sha }}
          path: manifest

      - name: Create the rolling release if it does not exist yet
        # `gh` is preinstalled on ubuntu-latest, so no third-party action is in
        # this path at all. First run creates the tag and the release; every
        # later run finds it and skips.
        #
        # TRAP: the git tag stays at the commit that first created it. It does
        # NOT follow main. Do not read the tag as "the commit this manifest came
        # from" — the release body below carries that, and is rewritten each run.
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --title "dbt manifest (rolling)" \
              --notes "Bootstrapping. The body is rewritten on every push to main." \
              --target "${{ github.sha }}"
          fi

      - name: Upload manifest.json, replacing the previous one
        # --clobber is required: without it, uploading an asset whose name
        # already exists on the release fails. The asset name is the fixed
        # filename on purpose, so the download URL never changes.
        run: gh release upload "$RELEASE_TAG" manifest/manifest.json --clobber

      - name: Record which commit this manifest came from
        # The only place the provenance is written, since the tag cannot move.
        run: |
          gh release edit "$RELEASE_TAG" --notes "$(
            printf '%s\n' \
              'Rolling release. `manifest.json` is replaced on every push to `main`.' \
              '' \
              "Source commit: \`${{ github.sha }}\`" \
              "Produced by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '' \
              'The git tag does not move. Read the source commit above, not the tag.'
          )"

      - name: Show the fetch URL §7 will use
        run: |
          {
            echo '### manifest.json'
            echo ''
            echo '```'
            echo '${{ github.server_url }}/${{ github.repository }}/releases/download/'"$RELEASE_TAG"'/manifest.json'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
