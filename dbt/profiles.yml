# One target, one profile: ClickHouse.
#
# ⚠️ THE DuckDB `dev` TARGET WAS REMOVED ON 2026-09-10, AT RIZKI'S DIRECTION.
# It is worth knowing what it was for before anyone puts it back. `dev` was an
# in-process, file-backed DuckDB database that needed no server and no credential,
# and it existed so that CI could run `dbt run` and `dbt test` for real inside
# GitHub's cloud — which cannot reach this estate, because it is behind CGNAT with
# no inbound route.
#
# What removing it costs, stated plainly rather than discovered later:
#
#   * CI NO LONGER EXECUTES ANY MODEL. It parses the project and publishes the
#     manifest; it does not build anything and it runs no test. A model that
#     parses but produces wrong SQL is now caught at run time, in the cluster, not
#     at merge time.
#   * `dbt compile` IS ALSO GONE FROM CI, and that surprises people. compile opens
#     a warehouse connection -- measured: it fails with `Database Error ...
#     Connection refused` -- so it cannot run where the warehouse is unreachable.
#     `dbt parse` does NOT connect, and that is what CI uses now.
#   * The old safety property "an unqualified `dbt run` cannot touch production,
#     because the default target is dev" IS GONE. There is no non-production
#     target to default to any more.
#
# 🚩 WHAT REPLACES THAT SAFETY PROPERTY. Not a default -- the network. ClickHouse
# accepts connections from ONE address only, the k3s node's, and that is enforced
# twice: by `ufw` on the LXC and by the database user's own HOST IP restriction.
# Neither GitHub's runner nor a laptop can reach it. The guard moved from "dbt picks
# a harmless target" to "there is no route", which is the stronger of the two -- but
# it is no longer visible in this file, which is why it is written here.
#
# The values come from the environment with NO DEFAULTS on host, user or password.
# This repository is PUBLIC, and the project convention (Phase 1 §4.4) is that no
# private address is ever committed -- a placeholder that happens to be correct is
# still a disclosure. A missing env_var must fail loudly rather than silently
# resolve to something plausible.

elt_project:
  target: prod
  outputs:

    prod:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      # ⚠️ NAME MISMATCH TO RESOLVE AT §10.3. The HelmRelease injects the password
      # into the Airflow containers as CLICKHOUSE_PASSWORD (§13.5), not under this
      # name. The dbt task pods do not inherit the Airflow container environment
      # anyway -- their env is set by `operator_args`, which is §10.3's work. Wire
      # both names to the same Secret key there, or rename one of them.
      password: "{{ env_var('CLICKHOUSE_ELT_WRITER_PASSWORD') }}"
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'elt') }}"
      # Plaintext HTTP on :8123, across the private bridge vmbr1 between two guests
      # of one hypervisor. Accepted deliberately, recorded rather than inherited
      # silently. Revisit at §11.4.
      secure: false
      threads: 4
