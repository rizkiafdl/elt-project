# Two targets, one profile.
#
#   dev  -> DuckDB.     Used by CI and by local work. In-process, file-backed,
#           no server and no credential. GitHub's runner cannot reach the homelab
#           (CGNAT), so this is the only target CI is ever allowed to select.
#   prod -> ClickHouse. The real warehouse, inside the private estate and not
#           routable from GitHub. Its connection values come from the environment
#           with no defaults. First exercised in Phase 2 step 11, NOT by CI.
#
# `dev` is the default on purpose: an unqualified `dbt run` must never be able to
# touch production. Reaching prod requires an explicit `--target prod`.

elt_project:
  target: dev
  outputs:

    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', 'dev.duckdb') }}"
      schema: main
      threads: 4

    prod:
      type: clickhouse
      # No defaults on host or user. This repository is public, and the project
      # convention (Phase 1 §4.4) is that no private address is ever committed —
      # a placeholder that happens to be correct is still a disclosure. Every
      # value is supplied in-cluster from the Secret in Phase 2 step 10, so a
      # missing env_var must fail loudly rather than silently resolve to
      # something plausible.
      host: "{{ env_var('CLICKHOUSE_HOST') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_ELT_WRITER_PASSWORD') }}"
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'elt') }}"
      secure: false
      threads: 4
